services:
  # PostgreSQL (runs in Docker on the remote server)
  postgres:
    image: postgres:17-alpine
    container_name: track-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # exposed on the host so you can restore the backup / connect with a GUI
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # any .sql/.sh dropped here runs automatically ON FIRST START (empty volume only)
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis cache (runs in Docker)
  redis:
    image: redis:7-alpine
    container_name: ied-redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Node/Express API (runs in Docker)
  server:
    build: ./server
    container_name: track-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Now points at the postgres service on the compose network
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_URL: redis://redis:6379
      # Public origin the browser uses to reach this server (for CSP)
      SERVER_HOST: ${HOST_IP}
      # Secure cookies require HTTPS. Keep false over plain HTTP, set true once TLS is in place.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # React app served by nginx (runs in Docker)
  client:
    build:
      context: ./client
      args:
        # Baked into the React build -> must be the IP browsers use to reach the server
        REACT_APP_API_URL: http://${HOST_IP}:5000
    container_name: track-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres-data:
  redis-data:
