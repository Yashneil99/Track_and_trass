name: server-v2
 

#  when does it run
on:
  push:
    paths:
      - 'server-v2/**' # so it will only run when the changes happen inside this directry
      - '.github/workflows/server-v2.yml'
  pull_request:
    paths:
      - 'server-v2/**'
      - '.github/workflows/server-v2.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-v2
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # throwaway database inside the CI run
          POSTGRES_DB: hul_track_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: hul_track_v2_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server-v2/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
